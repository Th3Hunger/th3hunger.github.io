<div class="qo" id="qo" hidden data-index="{{ "search.json" | relURL }}" data-notfound="{{ "404.html" | relURL }}">
  <div class="qbox" role="dialog" aria-modal="true" aria-label="quick open">
    <input id="qi" type="text" placeholder="Go to post, project or tag…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="ql" aria-autocomplete="list">
    <div class="ql" id="ql" role="listbox" aria-label="results"></div>
    <div class="qhint"><span>↑↓ move</span><span>↵ open</span><span>esc close</span></div>
  </div>
</div>
