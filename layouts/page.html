{{ define "main" }}
<div class="pw">
  <article class="post">
    <h1>{{ .Title }}</h1>
    {{- with .Params.lead }}
    <p class="lead">{{ . | markdownify }}</p>
    {{- end }}
    <div class="body" id="body">
{{ .Content }}
    </div>
  </article>
  {{ partial "outline.html" . }}
</div>
{{ end }}
