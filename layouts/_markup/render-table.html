{{- /* Tables scroll sideways on small screens instead of breaking the layout. */ -}}
<div class="tbl"><table
  {{- range $k, $v := .Attributes }}{{ if $v }} {{ printf "%s=%q" $k (string $v) | safeHTMLAttr }}{{ end }}{{ end }}>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th{{ with .Alignment }} style="text-align:{{ . }}"{{ end }}>{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td{{ with .Alignment }} style="text-align:{{ . }}"{{ end }}>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table></div>
